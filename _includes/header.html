<header>
  <nav class="nav-bar" aria-label="Primary">
    {%- for item in site.data.navigation %}
    {%- unless forloop.first %}
    <span class="nav-separator" aria-hidden="true">|</span>
    {%- endunless %}
    <a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a>
    {%- endfor %}
  </nav>
  <button id="theme-toggle" type="button" aria-pressed="false"><span class="toggle-state" aria-hidden="true">○</span> Dark mode</button>
</header>
